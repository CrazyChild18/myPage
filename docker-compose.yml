services:
  voyageplanner:
    build:
      context: .
      args:
        VITE_AMAP_JS_API_KEY: ${VITE_AMAP_JS_API_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
        VITE_GOOGLE_MAPS_BROWSER_KEY: ${VITE_GOOGLE_MAPS_BROWSER_KEY:-}
    container_name: voyageplanner
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-25565}:8080"
    environment:
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      OVERSEAS_GEOCODE_PROVIDER: ${OVERSEAS_GEOCODE_PROVIDER:-google}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
    volumes:
      - voyageplanner-data:/data

volumes:
  voyageplanner-data:
